# cp-local: lean instance (Kafka, Schema Registry, Control Center, Flink, SQL Gateway) for the isolated local
# minikube cluster (local/cp-local-cluster.sh, doc/local-cluster.md). Sized down for a single
# small node: one broker with replication factor 1 and reduced requests. CFK sets each JVM heap to
# the memory request, so lowering a request lowers the real footprint.
kraftController:
  dataVolumeCapacity: 1Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }

kafka:
  replicas: 1
  dataVolumeCapacity: 2Gi
  resources:
    requests: { cpu: 250m, memory: 768Mi }
  configOverrides:
    - default.replication.factor=1
    - min.insync.replicas=1
    - offsets.topic.replication.factor=1
    - transaction.state.log.replication.factor=1
    - transaction.state.log.min.isr=1
    - confluent.license.topic.replication.factor=1
    - confluent.metadata.topic.replication.factor=1
    - confluent.balancer.topic.replication.factor=1
    - confluent.cluster.link.metadata.topic.replication.factor=1
    - confluent.durability.topic.replication.factor=1
    - confluent.tier.metadata.replication.factor=1
    - confluent.metrics.reporter.topic.replicas=1
    - confluent.security.event.logger.exporter.kafka.topic.replicas=1

schemaRegistry:
  resources:
    requests: { cpu: 50m, memory: 384Mi }

connect:
  enabled: false
ksqldb:
  enabled: false
kafkaRestProxy:
  enabled: false
# Control Center UI (port-forward: local/cp-local-cluster.sh ui), smaller volumes.
controlCenter:
  dataVolumeCapacity: 2Gi
  prometheusVolumeCapacity: 2Gi
  resources:
    requests: { cpu: 200m, memory: 1Gi }
  configOverrides: # internal topics default to replication factor 3
    - confluent.controlcenter.internal.topics.replication=1
    - confluent.controlcenter.command.topic.replication=1
    - confluent.monitoring.interceptor.topic.replication=1
    - confluent.metrics.topic.replication=1

flink:
  exampleApplication:
    enabled: false
  # Smaller per-statement clusters so two statements fit next to everything else on the node.
  sql:
    computePool:
      flinkConfiguration:
        execution.checkpointing.interval: 10s
        taskmanager.numberOfTaskSlots: "1"
        taskmanager.memory.managed.fraction: "0.1"
      jobManager:
        resource: { cpu: 0.25, memory: 768m }
      taskManager:
        resource: { cpu: 0.5, memory: 1024m }

sqlGateway:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  session:
    jobManager:
      resource: { cpu: 0.5, memory: 1024m }
    taskManager:
      resource: { cpu: 0.5, memory: 1536m }
