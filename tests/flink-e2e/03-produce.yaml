# Flink SQL e2e step 3: bounded insert of the test rows.
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: e2e-produce
spec:
  flinkEnvironment: __FLINK_ENV__
  cmfRestClassRef:
    name: cmf
  computePoolName: __POOL__
  properties:
    sql.current-catalog: __CATALOG__
    sql.current-database: __DATABASE__
  statement: >-
    INSERT INTO e2e_in VALUES (1, 'alpha'), (2, 'beta'), (3, 'gamma')
