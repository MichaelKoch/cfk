{{- if and (index .Values "confluent-manager-for-apache-flink" "enabled") .Values.cmfNodePort }}
# CMF REST API reachable from outside the cluster at <node-ip>:<cmfNodePort> (the subchart only has a ClusterIP Service).
apiVersion: v1
kind: Service
metadata:
  name: cmf-service-np
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: confluent-manager-for-apache-flink
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: {{ .Values.cmfNodePort }}
{{- end }}
