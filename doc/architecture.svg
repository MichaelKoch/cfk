<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 775" width="1600" height="775" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>cfk architecture: isolated local minikube cluster with operators and cp-local</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .ns { fill: #fafafa; stroke: #888; stroke-width: 1.5; }
      .op { fill: #ece6f7; stroke: #6a4fa3; stroke-width: 1.5; }
      .core { fill: #e3eefb; stroke: #2f6db3; stroke-width: 1.5; }
      .client { fill: #e2f4f1; stroke: #2b8a7e; stroke-width: 1.5; }
      .flink { fill: #fdebdc; stroke: #c4651d; stroke-width: 1.5; }
      .infra { fill: #f1f1f1; stroke: #777; stroke-width: 1.2; }
      .off { fill: #ffffff; stroke: #aaa; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .t { font-weight: 600; fill: #222; }
      .s { font-size: 12px; fill: #444; }
      .h { font-size: 14px; font-weight: 700; fill: #333; }
      .flow { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .ctl { stroke: #6a4fa3; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .lbl { font-size: 11.5px; fill: #555; }
    </style>
  </defs>

  <rect width="1600" height="775" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="38" font-size="22" font-weight="700" fill="#222">Confluent Platform on Kubernetes (CFK): architecture</text>
  <text x="30" y="60" class="s">One isolated local minikube cluster, created by local/cp-local-cluster.sh: operators in confluent-operator, one lean Confluent Platform instance in cp-local</text>

  <!-- Cluster frame -->
  <rect x="20" y="75" width="1560" height="650" rx="10" fill="none" stroke="#bbb" stroke-width="1.5"/>
  <text x="35" y="96" class="h">Isolated local cluster: minikube profile cfk-local (docker, containerd, Kubernetes v1.37.0, 1 node) · context cfk-local in ~/.kube/config</text>

  <!-- ===== confluent-operator namespace ===== -->
  <rect x="45" y="110" width="370" height="510" rx="8" class="ns"/>
  <text x="60" y="132" class="h">namespace confluent-operator</text>
  <text x="60" y="149" class="s">chart confluent-operators + operators-cp-local.yaml</text>

  <rect x="65" y="165" width="330" height="95" rx="6" class="op"/>
  <text x="80" y="188" class="t">CFK operator 3.3.1</text>
  <text x="80" y="207" class="s">Reconciles CP custom resources (Kafka, SR, …)</text>
  <text x="80" y="224" class="s">and Flink SQL CRs (enableFlinkSQL: true)</text>
  <text x="80" y="241" class="s">Watches cp-local · 100m / 256Mi</text>

  <rect x="65" y="325" width="330" height="95" rx="6" class="op"/>
  <text x="80" y="348" class="t">CMF 2.4.4 (Confluent Manager for Flink)</text>
  <text x="80" y="367" class="s">cmf-service:80 · REST NodePort 30080</text>
  <text x="80" y="384" class="s">SQLite on a PVC, trial license</text>
  <text x="80" y="401" class="s">100m / 768Mi (limit 1Gi)</text>

  <rect x="65" y="490" width="330" height="110" rx="6" class="op"/>
  <text x="80" y="513" class="t">CP Flink Kubernetes Operator 1.15.0-cp4</text>
  <text x="80" y="532" class="s">Reconciles FlinkDeployment → JobManager /</text>
  <text x="80" y="549" class="s">TaskManager pods; creates the flink SA</text>
  <text x="80" y="566" class="s">Admission webhook (certs from cert-manager)</text>
  <text x="80" y="583" class="s">Watches cp-local · 100m / 512Mi (limit 1Gi)</text>

  <path d="M230,260 V323" class="flow"/>
  <text x="240" y="279" class="lbl">CMF REST API: Flink CRs</text>
  <text x="240" y="294" class="lbl">(Environment, Application,</text>
  <text x="240" y="309" class="lbl">Statement, ComputePool)</text>
  <path d="M230,420 V488" class="flow"/>
  <text x="240" y="458" class="lbl">creates FlinkDeployment</text>

  <!-- Watch-scope bus -->
  <path d="M395,212 H436" class="ctl"/>
  <path d="M395,372 H436" class="ctl"/>
  <path d="M395,545 H436" class="ctl"/>
  <rect x="436" y="165" width="10" height="385" rx="3" fill="#ece6f7" stroke="#6a4fa3" stroke-width="1.2"/>
  <text transform="translate(431,520) rotate(-90)" class="lbl" fill="#6a4fa3">watches cp-local</text>
  <path d="M446,330 H468" class="ctl"/>

  <!-- ===== cp-local namespace ===== -->
  <rect x="470" y="110" width="1090" height="510" rx="8" class="ns"/>
  <text x="485" y="132" class="h">namespace cp-local</text>
  <text x="650" y="132" class="s">release cp-local · charts/confluent-platform · environments/cp-local.yaml (CP 8.2.4, KRaft, no security, JVM heap = memory request)</text>

  <!-- Row 1: Kafka core -->
  <rect x="495" y="150" width="210" height="80" rx="6" class="core"/>
  <text x="510" y="173" class="t">KRaft controller ×1</text>
  <text x="510" y="192" class="s">100m / 512Mi</text>
  <text x="510" y="209" class="s">Metadata quorum</text>

  <rect x="775" y="150" width="250" height="80" rx="6" class="core"/>
  <text x="790" y="173" class="t">Kafka broker ×1</text>
  <text x="790" y="192" class="s">250m / 768Mi · RF 1 (overrides)</text>
  <text x="790" y="209" class="s">:9071 · external NodePort 30000</text>

  <rect x="1095" y="150" width="220" height="80" rx="6" class="core"/>
  <text x="1110" y="173" class="t">Schema Registry ×1</text>
  <text x="1110" y="192" class="s">50m / 384Mi · :8081</text>
  <text x="1110" y="209" class="s">External NodePort 30081</text>

  <rect x="1335" y="150" width="205" height="80" rx="6" class="client"/>
  <text x="1350" y="173" class="t">Control Center 2.6.1</text>
  <text x="1350" y="192" class="s">200m / 1Gi · UI :9021</text>
  <text x="1350" y="209" class="s">+ Prometheus, Alertmanager</text>

  <path d="M775,190 H707" class="flow"/>
  <text x="712" y="183" class="lbl">quorum</text>
  <path d="M1093,190 H1027" class="flow"/>
  <text x="1035" y="183" class="lbl">bootstrap</text>

  <!-- Row 2: Flink -->
  <rect x="495" y="250" width="510" height="165" rx="6" fill="none" stroke="#c4651d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="510" y="269" class="s" font-weight="600">Flink via CMF (CFK → CMF → Flink operator)</text>

  <rect x="510" y="280" width="200" height="55" rx="6" class="flink"/>
  <text x="522" y="302" class="t">CMFRestClass cmf</text>
  <text x="522" y="320" class="s">→ cmf-service (operator ns)</text>
  <rect x="510" y="345" width="200" height="55" rx="6" class="flink"/>
  <text x="522" y="367" class="t">FlinkEnvironment</text>
  <text x="522" y="385" class="s">cp-local (name = namespace)</text>

  <rect x="740" y="280" width="250" height="120" rx="6" class="flink"/>
  <text x="755" y="303" class="t">Shared Flink SQL (flink.sql)</text>
  <text x="755" y="322" class="s">Catalog cp-local (Schema Reg.)</text>
  <text x="755" y="339" class="s">Database kafka · pool shared</text>
  <text x="755" y="356" class="s">Flink 1.19 · own JM + TM</text>
  <text x="755" y="373" class="s">JM 0.25 CPU / 768m,</text>
  <text x="755" y="390" class="s">TM 0.5 CPU / 1024m</text>
  <path d="M712,372 H738" class="flow"/>

  <rect x="1020" y="250" width="520" height="165" rx="6" fill="none" stroke="#c4651d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1035" y="269" class="s" font-weight="600">Flink SQL Gateway (Flink operator directly, no CMF)</text>

  <rect x="1035" y="280" width="210" height="120" rx="6" class="flink"/>
  <text x="1050" y="303" class="t">sql-gateway</text>
  <text x="1050" y="322" class="s">Deployment + Service</text>
  <text x="1050" y="339" class="s">REST :8083</text>
  <text x="1050" y="356" class="s">100m / 512Mi (limit 1Gi)</text>
  <text x="1050" y="373" class="s">Flink 1.19 (cp-flink-sql)</text>
  <text x="1050" y="390" class="s">curl, sql-client, JDBC</text>

  <rect x="1300" y="280" width="225" height="120" rx="6" class="flink"/>
  <text x="1315" y="303" class="t">sql-gateway-session</text>
  <text x="1315" y="322" class="s">Session mode, Flink 1.19</text>
  <text x="1315" y="339" class="s">REST :8081</text>
  <text x="1315" y="356" class="s">JM 0.5 CPU / 1024m</text>
  <text x="1315" y="373" class="s">TM 0.5 CPU / 1536m</text>
  <text x="1315" y="390" class="s">TaskManagers on demand</text>
  <path d="M1245,340 H1298" class="flow"/>
  <text x="1250" y="332" class="lbl">remote</text>

  <!-- Row 3: tests -->
  <rect x="495" y="430" width="1045" height="70" rx="6" class="client"/>
  <text x="510" y="453" class="t">e2e tests (local/cp-local-cluster.sh test)</text>
  <text x="510" y="472" class="s">tests/sql-gateway-e2e: REST → session cluster → Kafka → bounded SELECT</text>
  <text x="510" y="489" class="s">tests/flink-e2e: CMF FlinkStatements on the shared pool, Kafka → Flink → Kafka, read back with Schema Registry</text>

  <!-- Row 4: disabled -->
  <rect x="495" y="515" width="1045" height="85" rx="6" class="off"/>
  <text x="510" y="538" class="t" fill="#777">In the chart, disabled in cp-local</text>
  <text x="510" y="558" class="s">Connect, ksqlDB, REST Proxy, example FlinkApplication state-machine</text>
  <text x="510" y="575" class="s">Toggle with &lt;component&gt;.enabled in environments/cp-local.yaml</text>

  <!-- Node and cluster prerequisites -->
  <rect x="45" y="640" width="370" height="62" rx="6" class="infra"/>
  <text x="60" y="662" class="t">Node cfk-local: 6 CPU / 10 GiB</text>
  <text x="60" y="682" class="s">Node IP: NodePorts Kafka, SR, CMF</text>
  <rect x="470" y="640" width="535" height="62" rx="6" class="infra"/>
  <text x="485" y="662" class="t">cert-manager v1.21.2 (installed by up)</text>
  <text x="485" y="682" class="s">Issues the Flink operator webhook certificate</text>
  <rect x="1025" y="640" width="535" height="62" rx="6" class="infra"/>
  <text x="1040" y="662" class="t">Storage class local-path (installed by up)</text>
  <text x="1040" y="682" class="s">minikube storage-provisioner-rancher addon, node-local PVCs</text>

  <!-- Legend -->
  <g transform="translate(30,742)">
    <rect x="0" y="0" width="22" height="14" rx="3" class="op"/><text x="30" y="12" class="s">Operator</text>
    <rect x="110" y="0" width="22" height="14" rx="3" class="core"/><text x="140" y="12" class="s">Kafka core</text>
    <rect x="235" y="0" width="22" height="14" rx="3" class="client"/><text x="265" y="12" class="s">UI / test</text>
    <rect x="340" y="0" width="22" height="14" rx="3" class="flink"/><text x="370" y="12" class="s">Flink</text>
    <rect x="410" y="0" width="22" height="14" rx="3" class="infra"/><text x="440" y="12" class="s">Node / cluster prerequisite</text>
    <rect x="630" y="0" width="22" height="14" rx="3" class="off"/><text x="660" y="12" class="s">Disabled</text>
    <path d="M740,7 H790" class="flow"/><text x="798" y="12" class="s">Uses / calls</text>
    <path d="M900,7 H950" class="ctl"/><text x="958" y="12" class="s">Operator reconciles resources in the namespace</text>
  </g>
</svg>
